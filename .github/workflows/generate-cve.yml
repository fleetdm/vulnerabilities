name: Generate CVE

on:
  push:
    branches:
      - main
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      clean:
        description: 'Download fresh feeds from NVD.  Any value other than "false" will trigger a clean download.'
        required: true
        default: "false"
      govulndb_skip_drop_check:
        description: 'Publish the Go vulnerability database without comparing it against the last published artifact. Clears a publisher stuck behind a bad baseline; leaves nothing guarding against a shrinking snapshot.'
        required: false
        type: boolean
        default: false

# Runs normally finish well inside the 30 minute schedule. When they don't (e.g. a
# full NVD sync after a broken release), queue instead of running several full
# syncs against the NVD API at once.
concurrency:
  group: generate-cve
  cancel-in-progress: false

permissions:
  contents: write

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  VULNCHECK_API_KEY: ${{ secrets.VULNCHECK_API_KEY }}
  VULNERABILITIES_CLEAN: ${{ github.event.inputs.clean || 'false' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@20cf305ff2072d973412fa9b1e3a4f227bda3c76 # v2.14.0
        with:
          egress-policy: audit

      - name: Checkout Repo
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: main

      - name: Import GPG Key
        uses: crazy-max/ghaction-import-gpg@e89d40939c28e39f97cf32126055eeae86ba74ec # v6.3.0
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
          git_user_signingkey: true
          git_commit_gpgsign: true

      - name: Checkout Fleet
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: fleetdm/fleet
          fetch-depth: 1
          ref: main
          path: fleet

      - name: Setup Go
        uses: actions/setup-go@93397bea11091df50f3d7e59dc26a7711a8bcfbe # v4.1.0
        with:
          cache: false
          go-version: "^1.25.7"

      - name: Generate NVD Feeds
        run: |
          cd fleet
          go mod download
          go run cmd/cve/generate.go --db_dir ./cvefeed --debug

      - name: Build goval-dictionary and ensure destination dir exists
        run: |
          cd fleet/third_party/goval-dictionary
          make build
          mkdir -p ../../cvefeed

      - name: Pull Amazon Linux 1 vulnerabilities
        run: for i in {1..3}; do fleet/third_party/goval-dictionary/goval-dictionary fetch amazon 1 --dbpath ./fleet/cvefeed/amzn_01.sqlite3 && s=0 && break || s=$? && sleep 2; done; (exit $s)
      - name: Pull Amazon Linux 2 vulnerabilities
        run: for i in {1..3}; do fleet/third_party/goval-dictionary/goval-dictionary fetch amazon 2 --dbpath ./fleet/cvefeed/amzn_02.sqlite3 && s=0 && break || s=$? && sleep 2; done; (exit $s)
      - name: Pull Amazon Linux 2022 vulnerabilities
        run: for i in {1..3}; do fleet/third_party/goval-dictionary/goval-dictionary fetch amazon 2022 --dbpath ./fleet/cvefeed/amzn_2022.sqlite3 && s=0 && break || s=$? && sleep 2; done; (exit $s)
      - name: Pull Amazon Linux 2023 vulnerabilities
        run: for i in {1..3}; do fleet/third_party/goval-dictionary/goval-dictionary fetch amazon 2023 --dbpath ./fleet/cvefeed/amzn_2023.sqlite3 && s=0 && break || s=$? && sleep 2; done; (exit $s)
      - name: Pull RHEL 5 vulnerabilities
        run: for i in {1..3}; do fleet/third_party/goval-dictionary/goval-dictionary fetch redhat 5 --dbpath ./fleet/cvefeed/rhel_05.sqlite3 && s=0 && break || s=$? && sleep 2; done; (exit $s)
      - name: Pull RHEL 6 vulnerabilities
        run: for i in {1..3}; do fleet/third_party/goval-dictionary/goval-dictionary fetch redhat 6 --dbpath ./fleet/cvefeed/rhel_06.sqlite3 && s=0 && break || s=$? && sleep 2; done; (exit $s)
      - name: Pull RHEL 7 vulnerabilities
        run: for i in {1..3}; do fleet/third_party/goval-dictionary/goval-dictionary fetch redhat 7 --dbpath ./fleet/cvefeed/rhel_07.sqlite3 && s=0 && break || s=$? && sleep 2; done; (exit $s)
      - name: Pull RHEL 8 vulnerabilities
        run: for i in {1..3}; do fleet/third_party/goval-dictionary/goval-dictionary fetch redhat 8 --dbpath ./fleet/cvefeed/rhel_08.sqlite3 && s=0 && break || s=$? && sleep 2; done; (exit $s)
      - name: Pull RHEL 9 vulnerabilities
        run: for i in {1..3}; do fleet/third_party/goval-dictionary/goval-dictionary fetch redhat 9 --dbpath ./fleet/cvefeed/rhel_09.sqlite3 && s=0 && break || s=$? && sleep 2; done; (exit $s)

      - name: Get week and date for cache key
        id: cache-key
        run: |
          echo "week=$(date -u +'%G-W%V')" >> $GITHUB_OUTPUT
          echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: Cache Ubuntu Security Notices repo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            fleet/cmd/osv-processor/ubuntu-security-notices/.git
            fleet/cmd/osv-processor/ubuntu-security-notices/osv
          key: osv-repo-${{ steps.cache-key.outputs.week }}-${{ steps.cache-key.outputs.date }}
          restore-keys: |
            osv-repo-${{ steps.cache-key.outputs.week }}-

      - name: Generate OSV Ubuntu Artifacts
        run: |
          echo "=== Generating OSV Artifacts for Ubuntu ==="
          cd $GITHUB_WORKSPACE/fleet/cmd/osv-processor

          # Sync OSV data from Canonical (shallow clone with rolling window)
          chmod +x sync-and-detect-changes.sh
          ./sync-and-detect-changes.sh

          # Generate artifacts for ALL Ubuntu versions (auto-detected)
          # Includes full artifacts + today's and yesterday's deltas
          go run . \
            --input ./ubuntu-security-notices/osv/cve \
            --output $GITHUB_WORKSPACE/fleet/cvefeed \
            --changed-files-today changed_files_today.txt \
            --changed-files-yesterday changed_files_yesterday.txt

          echo "OSV artifacts generated successfully"
          ls -lh $GITHUB_WORKSPACE/fleet/cvefeed/osv-ubuntu-*.json.gz

      - name: Generate OSV RHEL Artifacts
        run: |
          echo "=== Generating OSV Artifacts for RHEL ==="
          curl -sL "https://storage.googleapis.com/osv-vulnerabilities/Red%20Hat/all.zip" \
            -o /tmp/rhel-osv.zip
          unzip -q /tmp/rhel-osv.zip -d /tmp/rhel-osv

          cd $GITHUB_WORKSPACE/fleet/cmd/osv-processor
          go run . \
            --platform rhel \
            --input /tmp/rhel-osv \
            --output $GITHUB_WORKSPACE/fleet/cvefeed \
            --versions "7,8,9,10"

          echo "RHEL OSV artifacts generated successfully"
          ls -lh $GITHUB_WORKSPACE/fleet/cvefeed/osv-rhel-*.json.gz

      - name: Generate OSV Android Artifacts
        run: |
          echo "=== Generating OSV Artifacts for Android ==="
          curl -sL "https://storage.googleapis.com/osv-vulnerabilities/Android/all.zip" \
            -o /tmp/android-osv.zip
          unzip -q /tmp/android-osv.zip -d /tmp/android-osv

          cd $GITHUB_WORKSPACE/fleet/cmd/osv-processor
          # No --versions filter: generate artifacts for all Android versions
          # discovered in the OSV corpus so every host-reported version is covered.
          go run . \
            --platform android \
            --input /tmp/android-osv \
            --output $GITHUB_WORKSPACE/fleet/cvefeed

          echo "Android OSV artifacts generated successfully"
          ls -lh $GITHUB_WORKSPACE/fleet/cvefeed/osv-android-*.json.gz

      # The Go vulnerability database is mirrored so Fleet servers never reach vuln.go.dev
      # directly, the same reason the OSV feeds are mirrored. The artifact rides on this release:
      # Fleet only reads assets from the latest one. The generator is cmd/govulndb-mirror in
      # fleetdm/fleet and the consumer is server/vulnerabilities/govulndb/; README.md here covers
      # the artifact contract.
      #
      # The publisher refuses to ship a snapshot much smaller than the last one that shipped, so
      # find that one first, scanning back through releases rather than reading only the newest: a
      # run that skipped publishing leaves a release carrying no Go artifact at all, and the drop
      # check must not quietly turn itself off after one skip.
      - name: Find last published Go vulnerability database artifact
        id: govulndb-previous
        run: |
          repo=${{ github.repository }}
          dir="$RUNNER_TEMP/govulndb-previous"
          mkdir -p "$dir"

          # The manual way out. Every run measures itself against the last published artifact, so
          # one bad baseline blocks every run after it and no amount of waiting clears it. Taking
          # no baseline is the only thing that does, and --first-run refuses to sit alongside
          # --previous, so the hunt is skipped outright rather than its result ignored. The alert
          # below fires on the way out, so a run that published unchecked is never silent.
          if [ "${{ github.event.inputs.govulndb_skip_drop_check }}" = "true" ]; then
            echo "drop check turned off for this run; publishing without a baseline"
            exit 0
          fi

          # The releases API returns each release's assets inline. Walk every page: the newest
          # page covers about two days at this cadence while releases are kept for three, so a
          # single page can miss a baseline that is still there and report a first run instead,
          # which would turn the drop check off while something to compare against exists.
          find_previous() {
            local found tag asset
            found=$(gh api --paginate -X GET "repos/$repo/releases" -f per_page=100 --jq '
              map(select(.draft | not))
              | map({tag: .tag_name, asset: ([.assets[].name | select(startswith("govulndb-") and endswith(".json.gz"))] | sort | last)})
              | map(select(.asset)) | first // empty | "\(.tag) \(.asset)"' | head -n 1) || return 1

            # Nothing published anywhere, so there is genuinely nothing to compare against. The
            # publisher needs that said outright: an absent baseline is otherwise indistinguishable
            # from a workflow that stopped passing one, which is how a drop check goes quiet.
            if [ -z "$found" ]; then
              echo "no Go vulnerability database artifact published yet; publishing without the drop check"
              return 0
            fi

            read -r tag asset <<< "$found"
            gh release download "$tag" -R "$repo" --pattern "$asset" --dir "$dir" --clobber || return 1
            echo "previous=$dir/$asset" >> "$GITHUB_OUTPUT"
            echo "comparing against $asset from $tag"
          }

          for attempt in 1 2 3; do
            find_previous && exit 0
            sleep $((attempt * 5))
          done

          # Publishing without the drop check is publishing blind, and failing here would take the
          # NVD and OSV artifacts down with it over a GitHub API hiccup. Skip and alert instead.
          echo "skip_reason=could not reach the GitHub API to find the last published artifact, so this run cannot make the drop check; skipped rather than publishing unchecked" >> "$GITHUB_OUTPUT"

      # Exits zero even when it decides not to publish: a bad upstream day should not page anyone,
      # and attaching no asset leaves Fleet servers on the last good artifact they downloaded.
      #
      # Which way it went is reported on this step's outputs, and nothing below writes them: the
      # generator appends them to $GITHUB_OUTPUT itself (cmd/govulndb-mirror/main.go, execute).
      # skipped is "true" or "false"; reason carries the check that tripped, one line, only when
      # it skipped. The alert step reads both, so if they are ever renamed there the `if:` just
      # evaluates false forever and the alert goes quiet instead of failing loudly.
      - name: Generate Go vulnerability database artifact
        id: govulndb
        if: steps.govulndb-previous.outputs.skip_reason == ''
        run: |
          echo "=== Generating Go vulnerability database artifact ==="
          cd $GITHUB_WORKSPACE/fleet/cmd/govulndb-mirror

          # The publisher requires a baseline unless the run says in so many words that it is the
          # first, so that a workflow which quietly stopped passing one cannot publish unchecked.
          previous="${{ steps.govulndb-previous.outputs.previous }}"
          if [ -n "$previous" ]; then
            baseline=(--previous "$previous")
          else
            baseline=(--first-run)
          fi

          go run . --output $GITHUB_WORKSPACE/fleet/cvefeed "${baseline[@]}"
          ls -lh $GITHUB_WORKSPACE/fleet/cvefeed/govulndb-*.json.gz || true

      # Skipping is safe but silent: Fleet keeps serving the artifact it already has, so weeks of
      # stale data look exactly like weeks of healthy runs from the outside. This alert is the only
      # thing that says otherwise, so it names the check that tripped and by how much.
      - name: Alert when the Go vulnerability database artifact was not published
        if: steps.govulndb.outputs.skipped == 'true' || steps.govulndb-previous.outputs.skip_reason != ''
        uses: slackapi/slack-github-action@16b6c78ee73689a627b65332b34e5d409c7299da # v1.18.0
        with:
          payload: |
            {
              "text": "Go vulnerability database artifact was not published\nhttps://github.com/fleetdm/vulnerabilities/actions/runs/${{ github.run_id }}",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "The Go vulnerability database artifact was not published: ${{ steps.govulndb.outputs.reason || steps.govulndb-previous.outputs.skip_reason }}\nhttps://github.com/fleetdm/vulnerabilities/actions/runs/${{ github.run_id }}"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_G_HELP_ENGINEERING_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK

      # A shrinking snapshot deletes vulnerabilities off customer hosts, so a run where nothing
      # checked for that says so. An empty previous is exactly that: it is what makes the step
      # above pass --first-run, so the same signal gates the alert. Paired with skipped=false it
      # means the run published without a baseline, whether because nothing has ever been
      # published or because someone turned the check off; the run log says which.
      - name: Alert when the Go vulnerability database artifact published with no drop check
        if: steps.govulndb-previous.outputs.previous == '' && steps.govulndb.outputs.skipped == 'false'
        uses: slackapi/slack-github-action@16b6c78ee73689a627b65332b34e5d409c7299da # v1.18.0
        with:
          payload: |
            {
              "text": "Go vulnerability database artifact published with no drop check\nhttps://github.com/fleetdm/vulnerabilities/actions/runs/${{ github.run_id }}",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "The Go vulnerability database artifact was published with no drop check\nhttps://github.com/fleetdm/vulnerabilities/actions/runs/${{ github.run_id }}"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_G_HELP_ENGINEERING_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK

      - name: Validate NVD Feeds
        run: |
          cd fleet
          go run cmd/cve/validate/main.go --db_dir ./cvefeed --debug

      - name: Compress goval sqlite files
        run: xz ./fleet/cvefeed/*.sqlite3

      - name: Current date
        id: date
        run: |
          echo "date=$(date +'%Y%m%d%H%M')" >> $GITHUB_OUTPUT

      - name: Tag
        run: |
          git tag -a cve-${{ steps.date.outputs.date }} -m "release ${{ steps.date.outputs.date }}"
          git push origin cve-${{ steps.date.outputs.date }}

      # Fleet servers pick the newest non-draft cve-* release, so keep the release a
      # draft until every asset has uploaded. A failed upload then leaves an
      # invisible draft instead of a release missing files.
      - name: Release (draft)
        uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844 # v0.1.15
        with:
          draft: true
          files: |
            fleet/cvefeed/*
          tag_name: cve-${{ steps.date.outputs.date }}
          target_commitish: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish release
        run: |
          tag=cve-${{ steps.date.outputs.date }}
          expected=$(find fleet/cvefeed -maxdepth 1 -type f | wc -l)
          actual=$(gh release view "$tag" -R ${{ github.repository }} --json assets --jq '.assets | length')
          if [ "$expected" != "$actual" ]; then
            echo "expected $expected assets, release has $actual"
            exit 1
          fi
          gh release edit "$tag" -R ${{ github.repository }} --draft=false

      - name: Delete Old Releases
        uses: dev-drprasad/delete-older-releases@5494cd8b61c31b3c7a15f6267901195ec7df64e8 # v0.3.2
        with:
          delete_tag_pattern: ^cve-.*
          keep_latest: 144
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
